<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MusicMan - Music Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-music-note-beamed me-2"></i>MusicMan</a>
            <div class="d-flex align-items-center">
                <div id="user-info" class="me-3 d-none">
                    <span id="username-display" class="text-white me-2"></span>
                    <button class="btn btn-sm btn-outline-danger" onclick="app.logout()">Logout</button>
                </div>
                <div id="auth-links">
                    <a href="#" onclick="app.showPage('login')" class="btn btn-sm btn-outline-light me-2">Login</a>
                    <a href="#" onclick="app.showPage('signup')" class="btn btn-sm btn-primary">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active text-white" href="#" onclick="app.showPage('search')">
                                <i class="bi bi-search me-2"></i>Search
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#" onclick="app.showPage('queue')">
                                <i class="bi bi-download me-2"></i>Download Queue
                            </a>
                        </li>
                        <li id="admin-link" class="nav-item d-none">
                            <a class="nav-link text-warning" href="#" onclick="app.showPage('admin')">
                                <i class="bi bi-shield-lock me-2"></i>Admin Panel
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">

                <!-- Search Page -->
                <div id="page-search" class="page">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">Discover Music</h1>
                    </div>
                    <div class="input-group mb-3">
                        <input type="text" id="search-input" class="form-control bg-dark text-white border-secondary" placeholder="Search for tracks, albums, artists...">
                        <button class="btn btn-primary" onclick="app.search()">Search</button>
                    </div>
                    <div id="search-results" class="row g-3">
                        <!-- Results will appear here -->
                    </div>
                </div>

                <!-- Queue Page -->
                <div id="page-queue" class="page d-none">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">Download Queue</h1>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover">
                            <thead>
                                <tr>
                                    <th>Track ID</th>
                                    <th>Status</th>
                                    <th>Progress</th>
                                    <th>Added At</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="queue-list"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Track Detail / Download Page -->
                <div id="page-track" class="page d-none">
                    <div id="track-detail-content"></div>
                </div>

                <!-- Login Page -->
                <div id="page-login" class="page d-none">
                    <div class="row justify-content-center pt-5">
                        <div class="col-md-4">
                            <div class="card p-4">
                                <h3 class="mb-4">Login</h3>
                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" id="login-username" class="form-control bg-dark text-white border-secondary">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" id="login-password" class="form-control bg-dark text-white border-secondary">
                                </div>
                                <button class="btn btn-primary w-100" onclick="app.handleLogin()">Login</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Signup Page -->
                <div id="page-signup" class="page d-none">
                    <div class="row justify-content-center pt-5">
                        <div class="col-md-4">
                            <div class="card p-4">
                                <h3 class="mb-4">Sign Up</h3>
                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" id="signup-username" class="form-control bg-dark text-white border-secondary">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" id="signup-password" class="form-control bg-dark text-white border-secondary">
                                </div>
                                <button class="btn btn-primary w-100" onclick="app.handleSignup()">Register</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Admin Page -->
                <div id="page-admin" class="page d-none">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">Admin Dashboard</h1>
                    </div>
                    <div id="admin-stats" class="row mb-4"></div>
                    <h3>Users</h3>
                    <div class="table-responsive">
                        <table class="table table-dark table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Username</th>
                                    <th>Role</th>
                                    <th>Created At</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admin-users-list"></tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
